# Keep the stock wg-quick template, boot ordering, and enablement semantics.
# The root-owned helper also preserves configurations in /etc/wireguard.
[Service]
EnvironmentFile=-/etc/vibeguard-network.env
ExecStart=
ExecStart=/usr/local/libexec/vibeguard-wg-quick up %i
ExecStop=
ExecStop=/usr/local/libexec/vibeguard-wg-quick down %i
ExecReload=
ExecReload=/usr/local/libexec/vibeguard-wg-quick reload %i
