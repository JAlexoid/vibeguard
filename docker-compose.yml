services:
  vibeguard:
    build: .
    # For the mDNS repeater use host networking and set VIBEGUARD_MDNS_UPSTREAM=<lan iface>
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    ports:
      - "8080:8080"
      - "51820:51820/udp"
    environment:
      VIBEGUARD_ADMIN_PASSWORD: change-me
      VIBEGUARD_SYSTEMD: "0"
      VIBEGUARD_NAT: "1"
      VIBEGUARD_NAT66: "0"
      VIBEGUARD_EGRESS_INTERFACE: auto
    volumes:
      - vibeguard-data:/var/lib/vibeguard
      - wireguard-conf:/etc/wireguard
volumes:
  vibeguard-data:
  wireguard-conf:
