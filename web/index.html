<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeGuard</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#222}
table{width:100%;border-collapse:collapse;margin:.5rem 0 1rem}
th,td{text-align:left;padding:.4rem;border-bottom:1px solid #ddd}
input{padding:.4rem;margin:.2rem .2rem .2rem 0}
button{padding:.4rem .8rem;margin:.1rem;cursor:pointer}
.err{color:#b00020}.on{color:#0a7d2c}.off{color:#888}
#qr{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center}
#qr div{background:#fff;padding:1rem;text-align:center}
</style>
</head>
<body>
<h1>VibeGuard</h1>
<div id="login" hidden>
  <form id="loginForm"><input type="password" id="pw" placeholder="Admin password" autofocus><button>Log in</button></form>
</div>
<div id="app" hidden>
  <button id="logout" style="float:right">Log out</button>
  <h2>Services</h2>
  <table><thead><tr><th>Name</th><th>Address</th><th>Port</th><th>Endpoint</th><th>Users</th><th>Status</th><th></th></tr></thead><tbody id="services"></tbody></table>
  <form id="svcForm">
    <input name="name" placeholder="Name (wg0)" required>
    <input name="address" placeholder="Address (10.8.0.1/24)" required>
    <input name="listenPort" type="number" placeholder="Port" value="51820" required>
    <input name="endpoint" placeholder="Public endpoint (host:port)" required>
    <input name="dns" placeholder="DNS (optional)">
    <button>Add service</button>
  </form>
  <h2>Users</h2>
  <table><thead><tr><th>Name</th><th>Service</th><th>Address</th><th></th></tr></thead><tbody id="users"></tbody></table>
  <form id="userForm">
    <select name="service" id="userSvc" required></select>
    <input name="name" placeholder="User name" required>
    <input name="allowedIPs" placeholder="Allowed IPs (default: all traffic)">
    <button>Add user</button>
  </form>
  <p id="msg" class="err"></p>
</div>
<div id="qr"><div><img id="qrImg" width="320" height="320" alt="QR code"><p><button id="qrClose">Close</button></p></div></div>
<script>
const $ = id => document.getElementById(id);
function td(tr, text) { const c = tr.insertCell(); c.textContent = text; return c; }
function btn(label, fn) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; return b; }
async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: body && JSON.stringify(body)});
  if (r.status === 401 && url !== '/api/login') { show(false); throw new Error('unauthorized'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function show(loggedIn) { $('login').hidden = loggedIn; $('app').hidden = !loggedIn; }
async function act(fn) { $('msg').textContent = ''; try { await fn(); await load(); } catch (e) { $('msg').textContent = e.message; } }
async function load() {
  const [svcs, users] = await Promise.all([api('GET', '/api/services'), api('GET', '/api/users')]);
  show(true);
  const sb = $('services'); sb.replaceChildren();
  $('userSvc').replaceChildren();
  for (const s of svcs) {
    const tr = sb.insertRow();
    td(tr, s.name); td(tr, s.address); td(tr, s.listenPort); td(tr, s.endpoint); td(tr, s.users);
    const st = td(tr, s.active ? 'running' : 'stopped'); st.className = s.active ? 'on' : 'off';
    const a = tr.insertCell();
    a.append(btn(s.active ? 'Stop' : 'Start', () => act(() => api('POST', `/api/services/${encodeURIComponent(s.name)}/${s.active ? 'stop' : 'start'}`))),
      btn('Delete', () => confirm(`Delete service ${s.name} and its users?`) && act(() => api('DELETE', `/api/services/${encodeURIComponent(s.name)}`))));
    $('userSvc').add(new Option(s.name, s.name));
  }
  const ub = $('users'); ub.replaceChildren();
  for (const u of users) {
    const tr = ub.insertRow();
    td(tr, u.name); td(tr, u.service); td(tr, u.address);
    const a = tr.insertCell();
    a.append(btn('QR', () => { $('qrImg').src = `/api/users/${u.id}/qr.png`; $('qr').style.display = 'flex'; }));
    const dl = document.createElement('a'); dl.href = `/api/users/${u.id}/config`; dl.textContent = 'Config'; a.append(dl, ' ');
    a.append(btn('Delete', () => confirm(`Delete user ${u.name}?`) && act(() => api('DELETE', `/api/users/${u.id}`))));
  }
}
$('qrClose').onclick = () => { $('qr').style.display = 'none'; $('qrImg').removeAttribute('src'); };
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  try { await api('POST', '/api/login', {password: $('pw').value}); $('pw').value = ''; await load(); } catch (err) { alert(err.message); }
};
$('logout').onclick = async () => { await api('POST', '/api/logout'); show(false); };
$('svcForm').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); const o = Object.fromEntries(f); o.listenPort = +o.listenPort; act(async () => { await api('POST', '/api/services', o); e.target.reset(); }); };
$('userForm').onsubmit = e => { e.preventDefault(); act(async () => { await api('POST', '/api/users', Object.fromEntries(new FormData(e.target))); e.target.name.value = ''; }); };
load().catch(() => show(false));
</script>
</body>
</html>
